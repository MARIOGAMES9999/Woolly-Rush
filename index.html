<html lang="en">

<title>Woolly Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#24331b;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;user-select:none}
#wrap{position:absolute;left:50%;top:50%;width:960px;height:640px;transform-origin:center center}
#c{position:absolute;left:0;top:0;width:960px;height:640px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
#ui{position:absolute;inset:0;pointer-events:none}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-weight:bold;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 30px;background:rgba(18,32,14,.86);border-radius:10px;color:#fff;overflow-y:auto;pointer-events:auto}
.screen.light{background:rgba(18,32,14,.38)}
h1{font-size:68px;color:#fff3c4;text-shadow:0 4px 0 #8a5a1f,0 8px 18px rgba(0,0,0,.5);margin-top:50px;letter-spacing:2px}
h2{font-size:34px;color:#fff3c4;text-shadow:0 3px 0 #8a5a1f;margin-top:6px}
h3{font-size:18px;color:#fff3c4;margin:8px 0 4px}
.sub{color:#e8f5d0;margin-top:-6px;font-size:18px;text-shadow:0 2px 4px #000}
.btn{font:bold 17px "Trebuchet MS",Verdana,sans-serif;color:#3b2a10;background:linear-gradient(#fff3c4,#f0cf7a);border:none;border-bottom:4px solid #b8862f;border-radius:10px;padding:10px 22px;cursor:pointer;min-width:150px;transition:transform .08s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.big{font-size:24px;padding:14px 34px;min-width:340px}
.btn.green{background:linear-gradient(#b4f59a,#5cc43a);border-bottom-color:#3a8a20;color:#123}
.btn.red{background:linear-gradient(#ff9a9a,#e04646);border-bottom-color:#9a2020;color:#fff}
.btn.small{min-width:0;padding:6px 12px;font-size:14px}
.col{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.cur{position:absolute;top:12px;right:16px;display:flex;gap:16px;font-weight:bold;font-size:18px;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:20px}
.ic{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin-right:5px;font-style:normal}
.ic.coin{background:radial-gradient(circle at 35% 35%,#fff6a0,#f1c40f 50%,#b8860b);box-shadow:0 0 0 1.5px #8a6200 inset}
.ic.star{width:auto;height:auto;color:#ffd32a;border-radius:0;font-size:18px;vertical-align:0;margin-right:3px}
.ic.wool{background:radial-gradient(circle at 40% 35%,#fff,#e2e2d6);box-shadow:0 0 0 1.5px #aaa inset}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 18px}
.lvgrid{display:grid;grid-template-columns:repeat(10,66px);gap:8px;margin:6px 0}
.lvl{width:66px;height:62px;border-radius:10px;border:none;border-bottom:4px solid #3a8a20;background:linear-gradient(#b4f59a,#5cc43a);font:bold 20px "Trebuchet MS";color:#123;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl:hover{filter:brightness(1.1)}
.lvl small{font-size:11px}
.lvl.hc{background:linear-gradient(#ff8a8a,#c0392b);border-bottom-color:#7a1a1a;color:#fff}
.lvl.locked{background:#555;border-bottom-color:#333;color:#999;cursor:not-allowed;filter:none}
.lvl.done{box-shadow:0 0 0 3px #fff3c4 inset}
.ug{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:880px}
.ug .card{display:flex;align-items:center;gap:12px;padding:10px 14px}
.ug .info{flex:1}
.ug .info b{font-size:16px}
.ug .info p{font-size:12.5px;color:#d7e6c8;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:14px;height:8px;border-radius:3px;background:rgba(255,255,255,.18)}
.pips i.on{background:#7bed9f}
.ln{display:flex;justify-content:space-between;gap:30px;padding:4px 0;font-size:16px}
.ok{color:#7bed9f}.ko{color:#ff7675}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tab{font:bold 13px "Trebuchet MS";padding:6px 10px;border-radius:8px;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
.tab.on{background:#f0cf7a;color:#3b2a10}
.tab.hot{background:linear-gradient(#ff7675,#d63031)}
.tab.hot.on{background:linear-gradient(#ffeaa7,#fdcb6e);color:#3b2a10}
.items{display:grid;grid-template-columns:repeat(6,86px);gap:8px;margin-top:10px}
.item{position:relative;width:86px;min-height:104px;border-radius:10px;background:rgba(255,255,255,.1);border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;text-align:center;padding:3px}
.item:hover{background:rgba(255,255,255,.2)}
.item.eq{border-color:#7bed9f;background:rgba(123,237,159,.15)}
.item .pr{font-weight:bold;color:#ffd32a}
.pr.own{color:#7bed9f;font-weight:bold}
.sale{position:absolute;top:3px;left:3px;background:#e74c3c;color:#fff;font-weight:bold;border-radius:7px;padding:1px 5px;font-size:10px}
.mini{width:64px;height:64px}
.prev{background:radial-gradient(circle at 50% 70%,#8fd65c,#4f8f2f);border-radius:14px}
.offers{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:18px}
.offer{position:relative;width:170px;border-radius:14px;padding:14px 10px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.offer:hover{background:rgba(255,255,255,.18)}
.offer.main{width:230px;padding:20px 12px;background:linear-gradient(rgba(253,203,110,.35),rgba(255,255,255,.08));border-color:#fdcb6e;box-shadow:0 0 26px rgba(253,203,110,.5)}
.badge{position:absolute;top:-12px;right:-12px;background:#e74c3c;color:#fff;font-weight:bold;border-radius:20px;padding:5px 10px;font-size:16px;transform:rotate(8deg);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.offer.main .badge{font-size:22px;padding:7px 13px}
.feat{background:#fdcb6e;color:#3b2a10;font-weight:bold;font-size:12px;border-radius:8px;padding:2px 8px;letter-spacing:1px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:6px 0;min-width:620px}
.val{display:inline-block;min-width:60px;text-align:center;font-weight:bold;font-size:18px}
.note{font-size:13px;color:#d7e6c8;text-align:center;max-width:620px}
</style>

    if(t==='time')o.v=Math.round(25+c.target/c.wp*3.5);if(t==='orbs')o.v=Math.min(5,2+Math.floor(n/8));if(t==='streak')o.v=Math.min(8,3+Math.floor(n/5));

const inSafe=p=>G.safe&&dist(p,SZ)<SZ.r;
function keepOut(e){if(!G.safe)return;const dx=e.x-SZ.x,dy=e.y-SZ.y,d=Math.hypot(dx,dy)||1,m=SZ.r+e.r;if(d<m){e.x=SZ.x+dx/d*m;e.y=SZ.y+dy/d*m;e.hit=true;}}
function genObst(cnt,n){const o=[];let tries=0;const types=n<4?['hay','tree','rock']:n<9?['hay','tree','rock','fenceH','fenceV']:Object.keys(OB);
  while(o.length<cnt&&tries++<800){const t=pick(types),[w,h]=OB[t],x=rand(FL+30,FR-30-w),y=rand(FT+30,FB-30-h);
    if(Math.abs(x+w/2-W/2)<w/2+170&&Math.abs(y+h/2-(FT+FB)/2)<h/2+80)continue;
    if(o.some(q=>x<q.x+q.w+36&&x+w+36>q.x&&y<q.y+q.h+36&&y+h+36>q.y))continue;o.push({t,x,y,w,h});}return o;}
function collide(e){e.hit=false;for(const o of G.obst){const nx=clamp(e.x,o.x,o.x+o.w),ny=clamp(e.y,o.y,o.y+o.h),dx=e.x-nx,dy=e.y-ny,d=Math.hypot(dx,dy);
  if(d<e.r){e.hit=true;if(d===0){const l=e.x-o.x,r=o.x+o.w-e.x,t=e.y-o.y,b=o.y+o.h-e.y,m=Math.min(l,r,t,b);if(m===l)e.x=o.x-e.r;else if(m===r)e.x=o.x+o.w+e.r;else if(m===t)e.y=o.y-e.r;else e.y=o.y+o.h+e.r;}else{e.x=nx+dx/d*e.r;e.y=ny+dy/d*e.r;}}}
  const cx=clamp(e.x,FL+e.r,FR-e.r),cy=clamp(e.y,FT+e.r,FB-e.r);if(cx!==e.x||cy!==e.y)e.hit=true;e.x=cx;e.y=cy;}
function freeSpot(r,away,minD){for(let i=0;i<300;i++){const x=rand(FL+r+10,FR-r-10),y=rand(FT+r+10,FB-r-10);
  if(G.obst.some(o=>x>o.x-r-6&&x<o.x+o.w+r+6&&y>o.y-r-6&&y<o.y+o.h+r+6))continue;
  if(G.safe&&Math.hypot(x-SZ.x,y-SZ.y)<SZ.r+r+12)continue;
  if(away&&away.some(a=>Math.hypot(a.x-x,a.y-y)<minD))continue;return{x,y};}return{x:FL+40,y:FT+40};}

function newWorld(cfg,mode){G={mode,cfg,n:cfg.n,t:0,at:0,shake:0,cd:mode==='demo'?0:cfg.hc?4:3,state:mode==='demo'?'demo':'play',safe:cfg.safe===true,obst:mode==='demo'?[]:genObst(cfg.obst,cfg.n),sheep:[],enemies:[],items:[],parts:[],floats:[],rings:[],players:[],objs:[],stats:{bitten:0,abil:0,stars:0,chests:0,streak:0,maxStreak:0},woolBank:0,pts:0,chestCoins:0,count:0,chestT:rand(5,9),starT:3,hcT:1};G.bg=makeBg(G.obst,G.safe);}

/* ================== UPDATE ================== */
const pSpeed=()=>G.mode==='single'?165+S.up.speed*16:175;
const dashCd=()=>4-(S.up.dash-1)*.7,whCd=()=>12-(S.up.whistle-1)*2;
function flt(x,y,s,col){if(!S.set.floats)return;G.floats.push({x,y,s,col,life:1.1});}
function burst(x,y,col,n){if(!S.set.parts)return;for(let i=0;i<n;i++){const a=rand(0,6.28),v=rand(40,140);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.4,.8),col,r:rand(2,4)});}}
function nearestP(e,skipSafe){let b=null,bd=1e9;for(const p of G.players){if(p.dead||(skipSafe&&inSafe(p)))continue;const d=dist(p,e);if(d<bd){bd=d;b=p;}}return[b,bd];}
function wander(e,dt,sp){e.wt-=dt;if(e.wt<=0||e.hit){e.wt=rand(1.2,3.5);if(Math.random()<.3){e.wdx=0;e.wdy=0;}else{const a=rand(0,6.283);e.wdx=Math.cos(a);e.wdy=Math.sin(a);}}
  e.x+=e.wdx*sp*dt;e.y+=e.wdy*sp*dt;if(e.wdx||e.wdy){e.mv=true;if(e.wdx)e.face=e.wdx>0?1:-1;}}
function updSheep(dt){for(const s of G.sheep){if(!s.wool){s.rg-=dt;if(s.rg<=0)s.wool=true;}
  s.mv=false;let fled=false;
  if(s.gold&&G.state==='play'){const[p,d]=nearestP(s,false);if(p&&d<230&&d>0){s.x+=(s.x-p.x)/d*140*dt;s.y+=(s.y-p.y)/d*140*dt;s.mv=true;s.face=s.x>p.x?1:-1;fled=true;}}
  if(!fled)wander(s,dt,s.gold?50:26);collide(s);keepOut(s);}}
function bite(p,e){if(p.inv>0||p.dash>0)return;
  if(p.shield>0){p.shield--;flt(p.x,p.y-34,'-1 🛡','#74b9ff');}else{p.lives--;flt(p.x,p.y-34,T('bitten'),'#ff7675');}
  if(S.set.shake)G.shake=.3;
  p.inv=1.5;const d=dist(p,e)||1;p.kx=(p.x-e.x)/d*420;p.ky=(p.y-e.y)/d*420;e.rest=1.3;e.tired=false;e.chase=false;e.chT=0;if(e.type==='bull'){e.st='idle';e.cd=2;}
  G.stats.bitten++;G.stats.streak=0;snd(160,.25,'sawtooth',.07,-90);burst(p.x,p.y,'#ff7675',10);}
function updEnemies(dt){const c=G.cfg,stealth=G.mode==='single'?1-S.up.stealth*.1:1,tire=c.tire||5,restT=c.restT||2;
  for(const e of G.enemies){const[p,d0]=G.state==='play'?nearestP(e,true):[null,1e9],d=d0||1;e.mv=false;
    if(e.stun>0){e.stun-=dt;continue;}
    if(e.type==='bull'){e.cd-=dt;
      if(e.st==='charge'){e.x+=e.dx*340*dt;e.y+=e.dy*340*dt;e.mv=true;e.stT-=dt;collide(e);keepOut(e);if(e.hit||e.stT<=0){e.st='idle';e.cd=2;}}
      else if(e.st==='aim'){e.stT-=dt;if(e.stT<=0){if(p){e.st='charge';e.stT=1.2;e.dx=(p.x-e.x)/d;e.dy=(p.y-e.y)/d;e.face=e.dx>0?1:-1;snd(110,.35,'sawtooth',.06);}else{e.st='idle';e.cd=1;}}}
      else{wander(e,dt,e.spd);collide(e);keepOut(e);if(p&&d<300&&e.cd<=0){e.st='aim';e.stT=.7;e.face=p.x>e.x?1:-1;}}}
    else{if(e.rest>0){e.rest-=dt;if(e.rest<=0)e.tired=false;wander(e,dt,e.spd*.3);}
      else{const lim=e.det*stealth*(e.chase?1.7:1),want=!!p&&(e.type==='wolf'||c.aggr||d<lim);
        if(want&&!e.chase&&e.type==='dog'&&!c.aggr)snd(320,.08,'square',.04,-150);
        e.chase=want;
        if(e.chase){e.chT+=dt;if(e.chT>=tire){e.chase=false;e.chT=0;e.rest=restT;e.tired=true;}
          else{e.x+=(p.x-e.x)/d*e.spd*dt;e.y+=(p.y-e.y)/d*e.spd*dt;e.face=p.x>e.x?1:-1;e.mv=true;}}
        else{e.chT=Math.max(0,e.chT-dt*.5);wander(e,dt,e.spd*.35);}}
      collide(e);keepOut(e);}
    if(G.state==='play')for(const q of G.players)if(!q.dead&&!inSafe(q)&&dist(q,e)<q.r+e.r-3)bite(q,e);}
  for(let i=0;i<G.enemies.length;i++)for(let j=i+1;j<G.enemies.length;j++){const a=G.enemies[i],b=G.enemies[j],d=dist(a,b),m=a.r+b.r;if(d>0&&d<m){const k=(m-d)/2/d,ox=(b.x-a.x)*k,oy=(b.y-a.y)*k;a.x-=ox;a.y-=oy;b.x+=ox;b.y+=oy;}}}
function shear(p,dt){if(inSafe(p)){p.shT=null;p.shP=0;return;}
  const reach=G.mode==='single'?30+S.up.reach*9:34;let best=null,bd=1e9;
  for(const s of G.sheep){if(!s.wool)continue;const d=dist(p,s)-s.r;if(d<reach&&d<bd){bd=d;best=s;}}
  if(!best){p.shT=null;p.shP=0;return;}if(p.shT!==best){p.shT=best;p.shP=0;}
  p.shP+=dt/(G.mode==='single'?1.3*Math.pow(.8,S.up.shear):1.1);
  if(p.shP>=1){p.shP=0;p.shT=null;best.wool=false;best.rg=best.gold?3.5:G.cfg.regrow;const g=G.cfg.wp;p.wool+=g;G.woolBank+=g;
    if(best.gold){G.count++;flt(best.x,best.y-24,'+1 ★','#ffd700');}else flt(best.x,best.y-24,'+'+g,'#fff');
    G.stats.streak++;G.stats.maxStreak=Math.max(G.stats.maxStreak,G.stats.streak);burst(best.x,best.y,'#fff',12);snd(700,.08,'triangle',.06,300);}}
function whistle(p){p.wcd=whCd();G.stats.abil++;G.rings.push({x:p.x,y:p.y,life:.6});snd(1800,.35,'sine',.05,400);
  for(const e of G.enemies)if(dist(e,p)<230){e.stun=3+(S.up.whistle-1)*.6;e.chase=false;e.chT=0;e.st='idle';}}
function updPlayers(dt){for(const p of G.players){if(p.dead)continue;
  let ix=(keys[p.k.r]?1:0)-(keys[p.k.l]?1:0),iy=(keys[p.k.d]?1:0)-(keys[p.k.u]?1:0);
  if(G.mode==='single'&&S.set.arrows){ix=clamp(ix+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),-1,1);iy=clamp(iy+(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),-1,1);}
  const l=Math.hypot(ix,iy);p.mv=l>0;if(l){ix/=l;iy/=l;p.ld={x:ix,y:iy};if(ix)p.face=ix>0?1:-1;}
  p.inv-=dt;p.dcd-=dt;p.wcd-=dt;
  if(G.mode==='single'){if(pressed.Space&&S.up.dash>0&&p.dcd<=0&&p.dash<=0){p.dash=.2;p.dcd=dashCd();G.stats.abil++;snd(500,.15,'sawtooth',.04,-300);}
    if(pressed.KeyE&&S.up.whistle>0&&p.wcd<=0)whistle(p);}
  const sp=pSpeed();
  if(p.dash>0){p.dash-=dt;p.x+=p.ld.x*sp*3*dt;p.y+=p.ld.y*sp*3*dt;if(S.set.parts)G.parts.push({x:p.x,y:p.y+5,vx:0,vy:0,life:.3,col:'rgba(255,255,255,.6)',r:6});}
  else{p.x+=ix*sp*dt;p.y+=iy*sp*dt;}
  p.x+=p.kx*dt;p.y+=p.ky*dt;const k=Math.pow(.002,dt);p.kx*=k;p.ky*=k;collide(p);shear(p,dt);}}
function spawnItem(type,life){const s=freeSpot(16,G.players,90);G.items.push({type,x:s.x,y:s.y,life,max:life});}
function take(it,p){
  if(it.type==='star'){G.pts+=3;G.stats.stars++;flt(it.x,it.y-20,'+3 ★','#ffe066');snd(1200,.1,'triangle',.05,400);}
  else if(it.type==='gstar'){G.count++;G.pts+=1;G.stats.stars++;flt(it.x,it.y-20,'+1 ★','#ffb300');snd(1300,.12,'triangle',.06,500);}
  else{G.stats.chests++;if(G.cfg.hc&&G.cfg.type===3)G.count++;const r=Math.random();
    if(r<.12){p.lives++;flt(it.x,it.y-20,T('lifeUp'),'#ff7675');}else if(r<.27){p.shield++;flt(it.x,it.y-20,T('shieldUp'),'#74b9ff');}
    else if(r<.42){const w=5+G.n;G.woolBank+=w;p.wool+=w;flt(it.x,it.y-20,'+'+w+' '+T('rw_wool'),'#fff');}
    else{const k=Math.round(10+G.n*2+rand(0,10));G.chestCoins+=k;flt(it.x,it.y-20,'+'+k+' '+T('rw_coins'),'#ffd32a');}
    burst(it.x,it.y,'#ffd700',14);melody([880,1175],70);}}
function updItems(dt){const c=G.cfg,lk=S.up.luck,p=G.players[0];
  if(!c.hc||c.type===0||c.type===2){G.chestT-=dt;if(G.chestT<=0){G.chestT=rand(14,22)/(1+lk*.2);spawnItem('chest',8+lk*1.5);}G.starT-=dt;if(G.starT<=0){G.starT=rand(6,10)/(1+lk*.2);spawnItem('star',7+lk);}}
  else if(c.type===1){if(!G.items.some(i=>i.type==='gstar')){G.hcT-=dt;if(G.hcT<=0){G.hcT=.8;spawnItem('gstar',8);}}}
  else{G.hcT-=dt;if(G.hcT<=0&&G.items.filter(i=>i.type==='chest').length<2){G.hcT=3.2;spawnItem('chest',5.5);}}
  for(const it of G.items){it.life-=dt;if(!p.dead&&dist(it,p)<p.r+15){it.got=true;take(it,p);}}G.items=G.items.filter(i=>!i.got&&i.life>0);}
function updFx(dt){G.shake=Math.max(0,G.shake-dt);for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt;}G.parts=G.parts.filter(q=>q.life>0);
  for(const f of G.floats){f.y-=30*dt;f.life-=dt;}G.floats=G.floats.filter(f=>f.life>0);for(const r of G.rings)r.life-=dt;G.rings=G.rings.filter(r=>r.life>0);}
function checkSingle(){const p=G.players[0],c=G.cfg;if(p.lives<=0)return endLevel(false);
  const done=!c.hc?G.woolBank>=c.target:(c.type===0?G.t>=c.goal:G.count>=c.goal);if(done)endLevel(true);}
function checkMP(){const[a,b]=G.players;if(a.lives<=0)return mpEnd(1,T('outOfLives',a.name));if(b.lives<=0)return mpEnd(0,T('outOfLives',b.name));
  if(mpCfg.mode==='target'){if(a.wool>=mpCfg.goal)return mpEnd(0);if(b.wool>=mpCfg.goal)return mpEnd(1);}else if(G.t>=mpCfg.time)mpEnd(a.wool>b.wool?0:b.wool>a.wool?1:-1);}
function step(dt){if(!G||G.state==='pause')return;G.at+=dt;updFx(dt);if(G.state==='end')return;
  if(G.state==='play'&&G.cd>0){G.cd-=dt;return;}if(G.state==='play')G.t+=dt;
  updSheep(dt);updEnemies(dt);if(G.state==='play'){updPlayers(dt);if(G.mode==='single'){updItems(dt);checkSingle();}else checkMP();}}

function abBox(x,y,lab,cd,max){ctx.fillStyle='rgba(255,255,255,.15)';rr(ctx,x,y-9,56,18,5);ctx.fill();if(cd>0){ctx.fillStyle='rgba(231,76,60,.6)';rr(ctx,x,y-9,Math.max(8,56*Math.min(1,cd/max)),18,5);ctx.fill();}txt(lab,x+28,y,11,cd>0?'#ddd':'#7bed9f','center');}

function detRings(){if(!S.set.rings||G.state!=='play'||G.cd>0||G.cfg.aggr)return;const st=G.mode==='single'?1-S.up.stealth*.1:1;ctx.setLineDash([6,6]);ctx.lineWidth=2;

const upCost=(base,l)=>Math.round(base*Math.pow(1.55,l));

function detRings(){if(!S.set.rings||G.state!=='play'||G.cd>0||G.cfg.aggr)return;const st=G.mode==='single'?1-S.up.stealth*.1:1,rc=S.set.cb?'255,146,43':'231,76,60';ctx.setLineDash([6,6]);ctx.lineWidth=2;
  for(const e of G.enemies){if(e.type!=='dog'||e.chase||e.stun>0||e.rest>0)continue;const[p,d]=nearestP(e,true),R=e.det*st;if(!p||d>R*1.5)continue;
    ctx.strokeStyle=d<R*1.15?`rgba(${rc},.75)`:`rgba(${rc},.3)`;ctx.beginPath();ctx.arc(e.x,e.y,R,0,7);ctx.stroke();}ctx.setLineDash([]);}

function weatherOf(n){if(n<8||isHC(n))return'';if(n===8)return'rain';if(n===11)return'night';const h=(Math.imul(n,2654435761)>>>0)%100;return h<26?'rain':h<46?'night':'';}
function lvCfg(n){
  if(isHC(n)){const k=(n-10)/5,type=k%4;return{n,hc:true,type,sheep:type===2?0:8,golden:type===2,dogs:Math.min(8,3+k),wolves:Math.min(3,Math.floor((k+1)/2)),bulls:Math.min(3,Math.floor(k/2)),aggr:true,safe:false,wp:4,obst:Math.min(18,8+k),dSpd:Math.min(140,100+k*4),det:400,coins:150+n*8,regrow:8,tire:Math.min(6,4+k*.3),restT:1.6,goal:[40+k*5,8+k*2,4+k,5+k][type]};}
  const r=Math.sqrt(n-1),wx=weatherOf(n);
  const c={n,hc:false,safe:true,sheep:Math.max(6,Math.round(13-n*.4)),dogs:Math.min(6,1+Math.floor(r*1.1)),
    wolves:n>=8?Math.min(2,1+Math.floor((n-8)/12)):0,bulls:n>=13?Math.min(2,1+Math.floor((n-13)/14)):0,
    target:15+n*4,wp:3+Math.floor(n/5),obst:Math.min(14,Math.round(2+r*2.4)),dSpd:Math.min(140,85+r*10),det:Math.min(220,140+r*15),
    coins:20+n*6,regrow:Math.max(5,8-n*.08),tire:Math.min(6,3.8+r*.45),restT:2,blacks:n>=6?1+(n>=18?1:0)+(n>=30?1:0):0,wx};
  if(wx==='night')c.det*=.85;if(wx==='rain')c.dSpd*=.93;return c;}
function newWorld(cfg,mode){G={mode,cfg,n:cfg.n,t:0,at:0,shake:0,cd:mode==='demo'?0:cfg.hc?4:3,state:mode==='demo'?'demo':'play',safe:cfg.safe===true,obst:mode==='demo'?[]:genObst(cfg.obst,cfg.n),sheep:[],enemies:[],items:[],parts:[],floats:[],rings:[],players:[],objs:[],stats:{bitten:0,abil:0,stars:0,chests:0,streak:0,maxStreak:0},woolBank:0,pts:0,chestCoins:0,count:0,chestT:rand(5,9),starT:3,hcT:1,
  wx:cfg.wx||'',drops:null,tut:null,bootT:rand(8,14)};G.bg=makeBg(G.obst,G.safe);}
function spawnAnimals(c){for(let i=0;i<c.sheep;i++){const s=freeSpot(14);G.sheep.push(mkSheep(s.x,s.y,false));}
  for(let i=0;i<(c.blacks||0);i++){const s=freeSpot(14,G.players,160),b=mkSheep(s.x,s.y,false);b.black=true;G.sheep.push(b);}
  if(c.golden){const s=freeSpot(14,G.players,200);G.sheep.push(mkSheep(s.x,s.y,true));}
  const away=G.players.length?G.players:[{x:W/2,y:(FT+FB)/2}];

function ensureDaily(){const k=dayKey();if(S.dm&&S.dm.d===k)return;const r=rng(k*31+7),u=S.unlocked,m=[];
  const pool=DMP.filter(x=>(x[0]!=='stun'||S.up.whistle)&&(x[0]!=='black'||u>=6));
  while(m.length<3){const x=pool[Math.floor(r()*pool.length)];if(m.some(q=>q.t===x[0]))continue;const rw=['coins','points','wool'][Math.floor(r()*3)];
    m.push({t:x[0],g:x[1][Math.floor(r()*3)],p:0,c:0,n:0,rw,a:{coins:40+u*4,points:15+u,wool:60+u*5}[rw]});}
  S.dm={d:k,m,b:0};save();}

function rollPrize(){const r=Math.random()*100,type=r<50?'wool':r<72?'coins':r<90?'points':'item',u=S.unlocked;
  if(type==='item'){const q=Math.random()*100;let tier=q<60?0:q<88?1:q<98?2:3,pool=[];
    while(!pool.length&&tier>=0){CATS.forEach(c=>COS[c].forEach((it,i)=>{if(it.p>0&&!it.ev&&rar(it.p)===tier)pool.push({c,i});}));if(!pool.length)tier--;}
    const x=pick(pool);return{type,c:x.c,i:x.i,tier};}
  const base={wool:40+u*5,coins:25+u*3,points:10+u*1.5}[type];return{type,amt:Math.round(base*rand(.8,2))};}

function drawWheel(rot){const cvw=document.getElementById('wh');if(!cvw)return;const x=cvw.getContext('2d'),R=150,cx=170,cy=180,n=SEG.length,sg=Math.PI*2/n;
  const col={wool:['#f5f5f5','#dfe6e9'],coins:['#fdcb6e','#f0b43c'],points:['#a29bfe','#8c7ae6'],item:['#ff7675','#e84393']},icn={wool:'🧶',coins:'💰',points:'⭐',item:'👕'};
  x.clearRect(0,0,340,350);x.save();x.translate(cx,cy);x.fillStyle='#8b5a2b';x.beginPath();x.arc(0,0,R+12,0,7);x.fill();
  SEG.forEach((s,i)=>{const a0=rot+i*sg;x.fillStyle=col[s][i%2];x.beginPath();x.moveTo(0,0);x.arc(0,0,R,a0,a0+sg);x.closePath();x.fill();x.strokeStyle='#8b5a2b';x.lineWidth=3;x.stroke();
    x.save();x.rotate(a0+sg/2);x.translate(R*.66,0);x.rotate(Math.PI/2);x.font='32px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(icn[s],0,0);x.restore();});
  for(let i=0;i<16;i++){const a=i*Math.PI/8+(WH.busy?performance.now()/300:0);x.fillStyle=i%2?'#fff3c4':'#ffd32a';circ(x,Math.cos(a)*(R+6),Math.sin(a)*(R+6),3.5);}
  x.fillStyle='#fff3c4';circ(x,0,0,24);x.fillStyle='#8b5a2b';circ(x,0,0,10);x.restore();
  x.fillStyle='#e74c3c';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(cx-15,cy-R-24);x.lineTo(cx+15,cy-R-24);x.lineTo(cx,cy-R+10);x.closePath();x.fill();x.stroke();}
function spinWheel(){if(WH.busy)return;if(spinsAvail()<1)return toast(T('noSpins'));S.wh.n--;
  const pr=rollPrize(),res=grantPrize(pr);track('spin');save();
  const idxs=SEG.map((s,i)=>s===pr.type?i:-1).filter(i=>i>=0),idx=pick(idxs),sg=Math.PI*2/SEG.length;
  let tgt=-Math.PI/2-(idx+.5)*sg+rand(-.35,.35)*sg;const turns=S.set.rm?1:6;while(tgt<WH.rot+turns*Math.PI*2)tgt+=Math.PI*2;
  const s0=WH.rot,dd=S.set.rm?900:4200,t0=performance.now();let ls=null;WH.busy=true;const b=document.getElementById('spinB');if(b)b.disabled=true;
  const f=now=>{const k=Math.min(1,(now-t0)/dd),e=1-Math.pow(1-k,3);WH.rot=s0+(tgt-s0)*e;const si=Math.floor((-Math.PI/2-WH.rot)/sg);if(si!==ls){ls=si;snd(1200,.03,'square',.03);}drawWheel(WH.rot);
    if(k<1)return requestAnimationFrame(f);WH.busy=false;WH.rot%=Math.PI*2;melody(pr.type==='item'?[523,659,784,1047,1319]:[660,880,1100],90);

function compStep(dt){

    if(p.dk.some(k=>pressed[k])&&p.dcd<=0&&p.dash<=0){p.dash=.2;p.dcd=3;p.dHit=false;snd(500,.15,'sawtooth',.04,-300);}

  const[a,b]=G.players;
  [[a,b],[b,a]].forEach(([p,q])=>{if(p.dead||q.dead||!(p.dash>0)||p.dHit||dist(p,q)>=p.r+q.r+6)return;p.dHit=true;
    const d=dist(p,q)||1;q.kx=(q.x-p.x)/d*360;q.ky=(q.y-p.y)/d*360;
    if(q.shield>0){q.shield--;flt(q.x,q.y-34,T('blocked'),'#74b9ff');snd(900,.1,'triangle',.05);return;}

  else{const nw=clamp(Math.round(H*vw/vh),800,1800);if(nw!==W&&setW(nw))applyW();}
  if(cv.width!==W)cv.width=W;cv.style.width=W+'px';cv.style.height=H+'px';wrap.style.width=W+'px';wrap.style.height=H+'px';
  wrap.style.transform=`translate(-50%,-50%) scale(${Math.min(vw/W,vh/H)})`;}
try{removeEventListener('resize',fit);}catch(e){}
addEventListener('resize',layout);addEventListener('orientationchange',()=>{setTimeout(layout,150);setTimeout(layout,500);});
layout();

/* ---------- Pantalla completa ---------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsCan=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isApp=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const fsBtn=st=>isApp()?'':`<button class="btn ${st} fsb" onclick="toggleFS()">${fsEl()?T('fsOff'):T('fsOn')}</button>`;
function toggleFS(){const d=document.documentElement;
  if(fsEl()){const ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex)ex.call(document);return;}
  if(!fsCan()){alert(T('fsNo'));return;}
  try{const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'});
    const lock=()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}};
    if(r&&r.then)r.then(lock).catch(()=>toast(T('fsErr')));else lock();}catch(e){toast(T('fsErr'));}}
window.toggleFS=toggleFS;
function fsCh(){document.querySelectorAll('.fsb').forEach(b=>b.textContent=fsEl()?T('fsOff'):T('fsOn'));setTimeout(layout,60);}
document.addEventListener('fullscreenchange',fsCh);document.addEventListener('webkitfullscreenchange',fsCh);
showMenu=(o=>function(){o();const sc=ui.querySelector('.screen'),b=fsBtn('small');if(sc&&b)sc.insertAdjacentHTML('beforeend',b.replace('class="btn small fsb"','class="btn small fsb" style="position:absolute;top:12px;left:16px;min-width:0"'));})(showMenu);
togglePause=(o=>function(){o();if(G&&G.state==='pause'){const col=ui.querySelector('.screen .col'),b=fsBtn('big');if(col&&b)col.insertAdjacentHTML('beforeend',b);}})(togglePause);
})();
/* ================== FIN FASE 4 ================== */

/* ================== INIT ================== */
showMenu();
requestAnimationFrame(loop);
</script>
